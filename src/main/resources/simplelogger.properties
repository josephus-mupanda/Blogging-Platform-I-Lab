# Application logging.
#
# INFO on the MongoDB driver prints the full client settings on every startup
# and a stack trace on every failed connection probe. WARN keeps genuine
# problems visible without that.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.mongodb.driver=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
