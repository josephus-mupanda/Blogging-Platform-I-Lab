# =====================================================================
# Smart Blogging Platform - application configuration
#
# Every value here can be overridden without editing this file:
#   1. a JVM system property     -Ddb.postgres.password=secret
#   2. an environment variable   DB_POSTGRES_PASSWORD=secret
#      (upper-case, dots become underscores)
#
# Credentials belong in the environment, not in version control. The
# default password below exists so a fresh clone runs against a local
# development server; change it, or override it, for anything else.
# =====================================================================

# --- PostgreSQL ------------------------------------------------------
db.postgres.url=jdbc:postgresql://localhost:5433/blogging_platform
db.postgres.user=postgres
db.postgres.password=postgres

# HikariCP. A desktop client does not need a large pool; what it needs is
# to never open a connection on the FX thread.
db.postgres.pool.maxSize=10
db.postgres.pool.minIdle=2
db.postgres.pool.connectionTimeoutMs=10000
db.postgres.pool.idleTimeoutMs=600000
db.postgres.pool.maxLifetimeMs=1800000

# --- MongoDB ---------------------------------------------------------
db.mongo.uri=mongodb://localhost:27017
db.mongo.database=blogging_platform

# --- Application behaviour -------------------------------------------
# Which store backs comments and reviews at runtime: POSTGRES or MONGO.
# Both implementations sit behind one interface so Phase 4 can benchmark
# them against each other by flipping this value.
app.comments.store=MONGO

# Cache sizing, consumed in Phase 4.
app.cache.posts.maxEntries=200
app.cache.enabled=true

# Page size for post listings.
app.pagination.pageSize=20

# Set true to log every SQL statement with its execution time.
app.debug.logQueries=false
