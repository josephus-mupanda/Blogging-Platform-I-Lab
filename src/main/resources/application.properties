# Smart Blogging Platform settings.
# A setting can be replaced without editing this file, for example with an
# environment variable: DB_MONGO_URI=mongodb+srv://... (dots become _, upper case).

# PostgreSQL: users, posts, tags
db.postgres.url=jdbc:postgresql://localhost:5433/blogging_platform
db.postgres.user=postgres
db.postgres.password=postgres

# MongoDB: comments, reviews
# serverSelectionTimeoutMS: give up after 3 seconds if MongoDB is not running.
db.mongo.uri=mongodb://localhost:27017/?serverSelectionTimeoutMS=3000
db.mongo.database=blogging_platform
