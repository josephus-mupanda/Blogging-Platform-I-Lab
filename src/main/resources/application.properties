# Smart Blogging Platform settings.
#
# Any value can be overridden without editing this file:
#   - JVM system property:   -Ddb.postgres.password=secret
#   - environment variable:  DB_POSTGRES_PASSWORD=secret (upper case, dots become underscores)

# PostgreSQL (users, posts, tags)
db.postgres.url=jdbc:postgresql://localhost:5433/blogging_platform
db.postgres.user=postgres
db.postgres.password=postgres
# Most connections the pool keeps open at the same time.
db.postgres.pool.maxSize=10

# MongoDB (comments, reviews)
db.mongo.uri=mongodb://localhost:27017
db.mongo.database=blogging_platform

# Where comments and reviews are stored: MONGO or POSTGRES.
app.comments.store=MONGO

# In-memory post cache.
app.cache.enabled=true
app.cache.posts.maxEntries=200
