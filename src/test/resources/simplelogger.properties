# Test logging.
#
# The MongoDB driver logs a full stack trace at INFO when it cannot reach a
# server. That is correct behaviour, but during a test run where the database
# is deliberately absent it buries the actual results under a wall of text.
# WARN keeps real problems visible without the connection-probe noise.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.mongodb.driver=error
org.slf4j.simpleLogger.log.com.zaxxer.hikari=warn
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
